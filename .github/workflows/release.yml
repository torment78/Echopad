name: Build unsigned EchoPad release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test and package
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          ./scripts/Build-UnsignedRelease.ps1 -Version $releaseVersion -SkipInstaller
      - name: Create draft for release review
        uses: softprops/action-gh-release@v2
        with:
          name: Unsigned Dev Release
          draft: true
          prerelease: true
          make_latest: false
          body_path: docs/RELEASE-NOTES.md
          files: |
            artifacts/release/**/*.zip
            artifacts/release/**/SHA256SUMS.txt
