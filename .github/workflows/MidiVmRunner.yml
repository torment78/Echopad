name: Build EchoPad snapshot
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Regression checks
        run: dotnet run --project Echopad.Tests -c Release
      - name: Publish EchoPad
        run: dotnet publish Echopad.App/Echopad.App.csproj -c Release -r win-x64 --self-contained true -p:SkipInstaller=true -o ./publish
      - name: Zip application
        run: Compress-Archive -Path publish/* -DestinationPath EchoPad-snapshot-win-x64-unsigned.zip
      - name: Update unsigned snapshot prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: EchoPad-snapshot-win-x64-unsigned.zip
          tag_name: snapshot-latest
          name: Unsigned development snapshot
          prerelease: true
          make_latest: false
          body: Automated unsigned snapshot. Numbered releases are used by the in-app update checker.
